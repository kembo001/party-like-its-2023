<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Party Like It's 2023</title>
  <link rel="icon" href="img/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">

  <main class="login">
    <form class="window" id="loginForm" autocomplete="off">
      <div class="title-bar">
        <span class="title-bar__title">Welcome :D</span>
        <div class="title-bar__controls" aria-hidden="true"><span>?</span><span>×</span></div>
      </div>
      <div class="login__body">
        <img class="login__icon" src="img/star-spinningnewnew.gif" alt="">
        <div class="login__fields">
          <p>Type the password to enter Party Like It's 2023.</p>
          <label for="password">Password:</label>
          <input type="password" id="password" name="password">
          <p class="login__hint">Hint: large biomolecules—specifically biopolymers or polynucleotides—that are essential to all known forms of life and viruses, where they store, transmit, and express genetic information</p>
        </div>
      </div>
      <div class="login__actions">
        <button type="submit" class="btn" id="submitBtn">OK</button>
        <button type="reset" class="btn">Cancel</button>
      </div>
    </form>
  </main>

  <div id="customModal" class="modal" role="alertdialog" aria-modal="true" aria-labelledby="errorTitle">
    <div class="window error-dialog">
      <div class="title-bar">
        <span class="title-bar__title" id="errorTitle">Error</span>
        <div class="title-bar__controls"><button type="button" class="close" data-close-modal aria-label="Close">×</button></div>
      </div>
      <div class="error-dialog__body">
        <img id="modalImage" src="img/adventure-time-bmo-game-over-aft70vderh10hupg.gif" alt="Game over">
        <p>Wrong password. Try again!</p>
      </div>
      <div class="error-dialog__actions">
        <button type="button" class="btn" data-close-modal>OK</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
